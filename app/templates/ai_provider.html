{% extends "base.html" %}
{% set section = "AI assistant" %}
{% set page_title = p.name %}
{% set page_subtitle = kinds[p.kind] %}
{% block page_actions %}<a class="btn ghost" href="/ai">Back</a>{% endblock %}
{% block content %}
<form method="post" action="/ai/providers/{{ p.id }}" class="card" style="max-width:720px" data-loading>
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <div class="card-body stack">
    <div class="field"><label for="name">Name</label><input id="name" name="name" required maxlength="64" value="{{ p.name }}"></div>
    <div class="field"><label for="model">Model{{ ' / deployment' if p.kind == 'azure_openai' }}</label><input id="model" name="model" value="{{ config.model }}"></div>
    {% if p.kind != 'openai' %}<div class="field"><label for="base_url">Base URL / endpoint</label><input id="base_url" name="base_url" value="{{ config.base_url }}"></div>{% endif %}
    {% if p.kind == 'azure_openai' %}<div class="field"><label for="api_version">API version</label><input id="api_version" name="api_version" value="{{ config.api_version }}"></div>{% endif %}
    <div class="field"><label for="api_key">API key</label><input id="api_key" name="api_key" type="password" autocomplete="off" placeholder="{{ 'stored · leave blank to keep' if key_stored else '' }}"></div>
    <div class="row">
      <div class="field w-sm"><label for="max_tokens">Max output tokens</label><input id="max_tokens" name="max_tokens" type="number" min="256" max="128000" value="{{ p.max_tokens }}"></div>
      <label class="check"><input type="checkbox" name="redact" value="true" {{ 'checked' if p.redact }}> Redact IPs and host names</label>
    </div>
    <div><button class="primary" type="submit"><svg class="icon"><use href="#i-check"/></svg>Save</button></div>
  </div>
</form>
{% endblock %}
