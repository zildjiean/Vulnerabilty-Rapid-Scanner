{# TH / EN switch: POST /profile/language, back to this page. Signed-in users only. #}
{% macro lang_switch() %}<form method="post" action="/profile/language" class="lang-switch" aria-label="{{ t('Language') }}"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="next" value="{{ request.url.path }}{{ '?' ~ request.url.query if request.url.query }}">{% for code, name in (('th', 'TH'), ('en', 'EN')) %}<button type="submit" name="language" value="{{ code }}" class="ghost sm{{ ' on' if lang == code }}" aria-pressed="{{ 'true' if lang == code else 'false' }}" lang="{{ code }}" title="{{ 'ภาษาไทย' if code == 'th' else 'English' }}">{{ name }}</button>{% endfor %}</form>{% endmacro %}
