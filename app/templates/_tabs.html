{# Page tab bar: plain links between pages that share one sidebar item (see app/navigation.py). No JS. #}
{% macro page_tabs(tabs, current, label='') -%}
<nav class="page-tabs" aria-label="{{ label }} pages"><div class="page-tabs-inner">{% for t in tabs %}<a href="{{ t.href }}"{% if t.href == current %} class="current" aria-current="page"{% endif %}>{{ t.label }}</a>{% endfor %}</div></nav>
{%- endmacro %}
