{# Page tab bar: plain links between pages that share one sidebar item (see app/navigation.py). No JS. #}
{% macro page_tabs(tabs, current, label='') -%}
<nav class="page-tabs" aria-label="{{ t('{label} pages', label=t(label)) }}" data-tour="page-tabs"><div class="page-tabs-inner">{% for tab in tabs %}<a href="{{ tab.href }}"{% if tab.href == current %} class="current" aria-current="page"{% endif %}>{{ t(tab.label) }}</a>{% endfor %}</div></nav>
{%- endmacro %}
