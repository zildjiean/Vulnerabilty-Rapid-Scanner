{% extends "base.html" %}
{% set section = "0-Day intelligence" %}
{% set page_title = "Edit rule #" ~ rule.id %}
{% set page_subtitle = "Changes are evaluated against the inventory immediately after saving." %}
{% block content %}
<form method="post" action="/rules/{{ rule.id }}/edit" class="card" style="max-width:760px" data-loading>
  <div class="card-body stack">
    {% include "_rule_fields.html" %}
    <div class="row"><button class="primary" type="submit"><svg class="icon"><use href="#i-check"/></svg>Save rule</button><a class="btn ghost" href="/rules">Cancel</a></div>
  </div>
</form>
{% endblock %}
