{% extends "base.html" %}
{% set page_title = t("Edit rule #{id}", id=rule.id) %}
{% set page_subtitle = t("Changes are evaluated against the inventory immediately after saving.") %}
{% block content %}
<form method="post" action="/rules/{{ rule.id }}/edit" class="card" style="max-width:760px" data-loading>
  <div class="card-body stack">
    {% include "_rule_fields.html" %}
    <div class="row"><button class="primary" type="submit"><svg class="icon"><use href="#i-check"/></svg>{{ t("Save rule") }}</button><a class="btn ghost" href="/rules">{{ t("Cancel") }}</a></div>
  </div>
</form>
{% endblock %}
